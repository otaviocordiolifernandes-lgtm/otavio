

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Site do Otávio</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #e6f2ff;
            color: #333333;
            margin: 20px;
        }

        h1 {
            color: #003366;
            text-align: center;
        }

        h2 {
            color: #004488;
            border-bottom: 1px solid #004488;
            padding-bottom: 5px;
        }

        .conteudo {
            background-color: white;
            padding: 15px;
            margin-bottom: 15px;
        }

        .imagem-tech {
            display: block;
            max-width: 100%;
            height: auto;
            width: 350px;
            margin: 15px auto;
        }

        footer {
            text-align: center;
            margin-top: 30px;
            font-size: 12px;
        }
    </style>
</head>
<body>

    <h1>Bem-vindo ao meu site!</h1>

    <div class="conteudo">
        <h2>Quem sou eu</h2>
        <p>Meu nome é Otávio. Criei este site simples usando HTML e CSS para mostrar um pouco sobre mim, minhas coisas favoritas e o que estou estudando na escola.</p>
       
        <img src="https://unsplash.com" alt="Tecnologia" class="imagem-tech">
    </div>

    <div class="conteudo">
        <h2>Meus Hobbies</h2>
        <ul>
            <li>Jogar videogame</li>
            <li>Ouvir música</li>
            <li>Aprender sobre computadores</li>
        </ul>
    </div>

    <footer>
        <p>Criado por Otávio 2026</p>
    </footer>

</body>
</html>
